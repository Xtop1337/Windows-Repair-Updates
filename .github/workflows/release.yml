name: Build, test & release

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        shell: powershell
        run: |
          $ver = "1.0.$env:GITHUB_RUN_NUMBER"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$ver" -Encoding ascii
          Write-Host "Версия: $ver"
          $PSVersionTable | Out-String | Write-Host

      - name: Модульные тесты (Pester, Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests/WURepair.Tests.ps1'
          $c.Run.PassThru = $true
          $c.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $c
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Сборка (единый .ps1 + .exe + .zip)
        shell: powershell
        run: ./build/Build.ps1 -Version $env:VERSION

      - name: Интеграционный тест (сломать → найти → починить)
        timeout-minutes: 30
        shell: powershell
        run: ./tests/Integration.Windows.ps1

      - name: Смоук-тест окна (.ps1)
        timeout-minutes: 12
        shell: powershell
        run: ./tests/UiSmoke.ps1 -Script dist/WURepair.ps1 -Out screenshots/ui-ps1.png

      - name: Смоук-тест окна (.exe)
        timeout-minutes: 12
        shell: powershell
        run: ./tests/UiSmoke.ps1 -Exe dist/WURepair.exe -Out screenshots/ui-exe.png

      - name: Журналы программы
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          if (Test-Path C:\WURepair\Logs) { Copy-Item C:\WURepair\Logs\* screenshots\ -ErrorAction SilentlyContinue }
          Get-ChildItem C:\WURepair\Logs -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 -Encoding UTF8 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WURepair-${{ env.VERSION }}
          path: |
            dist/WURepair.exe
            dist/WURepair-*.zip
            screenshots/

      - name: Публикация релиза
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release create $tag "dist/WURepair-$env:VERSION.zip" "dist/WURepair.exe" `
            --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" `
            --title "WURepair $env:VERSION" --notes-file build/RELEASE_NOTES.md --latest
